<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title></title>
    <meta
      name="description"
      content="Gabriel O. Laureano - Computer Scientist, Software Tester, Quality Assurance Engineer."
    />
    <link rel="icon" href="https://avatars.githubusercontent.com/u/43646296" type="image/png" />
    <script>
      /* Theme before first paint: the visitor's pick, else the OS (THEME-04, THEME-05). */
      (function () {
        var t = null;
        try {
          t = localStorage.getItem("dossier-ds");
        } catch (e) {}
        if (["paper", "void", "blueprint"].indexOf(t) < 0) {
          t = window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "void" : "paper";
        }
        document.documentElement.setAttribute("data-theme", t);
      })();
    </script>
  </head>
  <body>
    <div id="pg-app">
      <div class="pg-wrap"><p class="pg-loading pg-cap" id="pg-loading">Opening file…</p></div>
    </div>
    <script>
      /* The loading line names the reason when the page script fails or never mounts (PAGE-11). */
      (function () {
        var failed = false;
        function fail(msg) {
          /* The first reason stays: the 10 s timer must not overwrite a load or render error. */
          if (window.__pgMounted || failed) return;
          failed = true;
          var el = document.getElementById("pg-loading");
          if (!el) {
            /* A failed render can clear #pg-app, so the loading line is rebuilt. */
            var wrap = document.createElement("div");
            wrap.className = "pg-wrap";
            el = document.createElement("p");
            el.className = "pg-loading pg-cap";
            el.id = "pg-loading";
            wrap.appendChild(el);
            document.getElementById("pg-app").appendChild(wrap);
          }
          el.textContent = "The file did not open. Reason: " + msg;
        }
        window.addEventListener(
          "error",
          function (e) {
            var t = e && e.target;
            fail(t && t.src ? "could not load " + t.src : e.message || "script error");
          },
          true,
        );
        setTimeout(function () {
          fail("the scripts did not finish loading within 10 s.");
        }, 10000);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
