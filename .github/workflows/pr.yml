name: PR

on:
  pull_request:

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
    steps:
      - uses: actions/checkout@v5
      - name: Check formatting
        run: >-
          npx --yes prettier@3.6.2 --check .
          --print-width 120 --tab-width 2 --no-use-tabs
          '!src/dossier/**' '!tests/fixtures/**'

  build-test:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v5
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
      - name: Test the built site
        run: npm run test:built
